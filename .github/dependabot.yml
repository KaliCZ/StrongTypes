version: 2
updates:
  # GitHub Actions — SHA-pinned third-party actions get auto-bumped here
  # so we keep supply-chain protection without manual upkeep.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Dependabot needs the root solution to discover the nested projects.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["[11.0.0,)"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: ["[11.0.0,)"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["[11.0.0,)"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: ["[11.0.0,)"]
      # ASP.NET Core 10 requires OpenAPI.NET 2.x; Swashbuckle 11 requires 3.x.
      - dependency-name: "Microsoft.OpenApi"
        versions: ["[3.0.0,)"]
      - dependency-name: "Swashbuckle.AspNetCore*"
        versions: ["[11.0.0,)"]
    groups:
      test-platform:
        patterns:
          - "FsCheck*"
          - "xunit.*"
          - "Microsoft.Testing.*"
          - "Microsoft.CodeCoverage"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
